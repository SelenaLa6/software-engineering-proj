apply plugin: 'java'
apply plugin: 'eclipse'

eclipse.project.name = 'FillThisIn' 

// java {
// 	toolchain {
// 		languageVersion = JavaLanguageVersion.of(25)
// 	}
// }

sourceSets {
	main {
	  java {
		srcDirs = ['src']
	  }
	}
	test {
	  java {
	     srcDirs = ['test']
	  }
	 }
}

test {
	filter {
		excludeTestsMatching "*SmokeTest"
		excludeTestsMatching "ComputeEngineTest"
	}
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.14.4')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	// testRuntimeOnly('org.junit.platform:junit-jupiter-engine')
	testImplementation('org.mockito:mockito-core:5.10.0')
	testImplementation('fr.inria.gforge.spoon:spoon-core:10.4.0')
	implementation('com.google.code.gson:gson:2.13.1')
}

test {
    useJUnitPlatform()
}